<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên - Hotel California</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .register-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            max-width: 520px;
            width: 100%;
            padding: 36px;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="text-center mb-4">
            <div class="fs-1 text-primary mb-2"><i class="bi bi-building"></i></div>
            <h2 class="fw-bold fs-4 text-dark mb-1">Hotel California</h2>
            <p class="text-secondary small">Tạo tài khoản thành viên để tận hưởng trọn vẹn dịch vụ lưu trú</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold small">Họ và tên <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" id="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small">Tên đăng nhập <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="nguyenvana" required autocomplete="username">
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label for="password" class="form-label fw-semibold small">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Ít nhất 6 ký tự" required autocomplete="new-password">
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label fw-semibold small">Nhập lại MK <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-check2-circle"></i></span>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required autocomplete="new-password">
                    </div>
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-md-6">
                    <label for="email" class="form-label fw-semibold small">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="name@example.com" autocomplete="email">
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label fw-semibold small">Số điện thoại</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                        <input type="tel" id="phone" class="form-control" placeholder="0901234567" autocomplete="tel">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                Đăng ký tài khoản
            </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top small text-secondary">
            Đã có tài khoản? <a href="login.html" class="fw-semibold text-primary text-decoration-none">Đăng nhập ngay</a>
            <div class="mt-2"><a href="index.html" class="text-secondary text-decoration-none">← Quay lại trang chủ</a></div>
        </div>
    </div>

    <!-- Bootstrap Bundle & App Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function handleRegister(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');

            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (password !== confirmPassword) {
                showToast('Mật khẩu xác nhận không khớp!', 'warning');
                return;
            }

            if (password.length < 6) {
                showToast('Mật khẩu phải có tối thiểu 6 ký tự!', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang tạo tài khoản...';

            try {
                const res = await apiCall('/api/auth/register', {
                    method: 'POST',
                    body: {
                        fullName,
                        username,
                        password,
                        email: email || null,
                        phone: phone || null
                    }
                });

                if (res && res.success) {
                    showToast('Đăng ký tài khoản thành công! Đang chuyển hướng...', 'success');
                    setTimeout(() => {
                        window.location.replace('login.html');
                    }, 1200);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Đăng ký tài khoản';
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Đăng ký tài khoản';
            }
        }
    </script>
</body>
</html>
