<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dịch Vụ - Hotel California</title>
    <!-- Zero-Flash Synchronous Route Guard -->
    <style>body { display: none; }</style>
    <script src="js/api.js"></script>
    <script>
        guardPageAccess(['ADMIN', 'MANAGER']);
    </script>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="top-navbar"></header>

    <div class="app-wrapper">
        <aside id="app-sidebar"></aside>

        <main class="app-main">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold fs-4 text-dark mb-1">
                        <i class="bi bi-cup-hot text-primary"></i> Quản Lý Dịch Vụ Khách Sạn
                    </h2>
                    <p class="text-secondary small mb-0">Thiết lập menu ẩm thực, đồ uống, giặt ủi và biểu phí dịch vụ lưu trú</p>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="loadServices()" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-clockwise"></i> Tải lại
                    </button>
                    <button onclick="openCreateServiceModal()" class="btn btn-primary btn-sm shadow-sm">
                        <i class="bi bi-plus-lg"></i> Thêm Dịch Vụ Mới
                    </button>
                </div>
            </div>

            <div class="card border shadow-sm">
                <div class="card-header bg-white py-3">
                    <h6 class="fw-bold mb-0 text-dark">Danh Mục Dịch Vụ Khách Sạn</h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Tên Dịch Vụ</th>
                                    <th>Danh mục</th>
                                    <th>Đơn Giá</th>
                                    <th>Đơn Vị</th>
                                    <th>Trạng Thái</th>
                                    <th class="text-end">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody id="servicesTableBody">
                                <tr><td colspan="7" class="text-center text-secondary py-4">Đang tải dữ liệu dịch vụ...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Thêm / Sửa Dịch Vụ -->
    <div class="modal fade" id="serviceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-primary text-white py-3">
                    <h5 class="modal-title fs-6 fw-bold" id="serviceModalTitle">Thêm Dịch Vụ Mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="serviceForm" onsubmit="handleSaveService(event)">
                    <input type="hidden" id="editServiceId">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold" for="serviceName">Tên dịch vụ <span class="text-danger">*</span></label>
                            <input type="text" id="serviceName" class="form-control" placeholder="Ví dụ: Bữa sáng Buffet California" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold" for="serviceCategoryId">Danh mục phân loại</label>
                            <select id="serviceCategoryId" class="form-select">
                                <option value="1">1 - Ẩm thực & Đồ uống (F&B)</option>
                                <option value="2">2 - Dịch vụ phòng & Giặt ủi</option>
                            </select>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-7">
                                <label class="form-label small fw-semibold" for="unitPrice">Đơn giá (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" id="unitPrice" class="form-control" placeholder="50000" min="0" step="1000" required>
                            </div>
                            <div class="col-5">
                                <label class="form-label small fw-semibold" for="serviceUnit">Đơn vị tính <span class="text-danger">*</span></label>
                                <input type="text" id="serviceUnit" class="form-control" placeholder="Suất, Chai, Kg..." required>
                            </div>
                        </div>

                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="isActiveCheck" checked>
                            <label class="form-check-label small fw-semibold" for="isActiveCheck">
                                Kích hoạt phục vụ (Cho phép khách đặt phòng gọi món)
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer bg-light py-2">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" id="saveServiceBtn" class="btn btn-primary btn-sm">Lưu dịch vụ</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle & App Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let adminServicesList = [];

        async function initPage() {
            renderTopNav('admin');
            renderSidebar('admin-services');
            loadServices();
        }

        async function loadServices() {
            try {
                const res = await apiCall('/api/admin/services');
                if (res && res.success) {
                    adminServicesList = res.data || [];
                    renderServicesTable(adminServicesList);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderServicesTable(services) {
            const tbody = document.getElementById('servicesTableBody');
            if (services.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary py-4">Chưa có dịch vụ nào trong hệ thống.</td></tr>';
                return;
            }

            tbody.innerHTML = services.map(s => `
                <tr>
                    <td>#${s.serviceId}</td>
                    <td><strong class="text-dark">${s.serviceName}</strong></td>
                    <td><span class="badge bg-light text-dark border">${s.category ? s.category.categoryName : 'Khác'}</span></td>
                    <td><strong class="text-primary">${formatVND(s.unitPrice)}</strong></td>
                    <td>${s.unit || 'Lần'}</td>
                    <td>
                        <span class="badge ${s.isActive ? 'bg-success' : 'bg-secondary'}">
                            ${s.isActive ? 'ĐANG KÍCH HOẠT' : 'TẠM TẮT'}
                        </span>
                    </td>
                    <td class="text-end">
                        <button onclick="openEditServiceModal(${s.serviceId})" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-pencil"></i> Sửa
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function openCreateServiceModal() {
            document.getElementById('serviceForm').reset();
            document.getElementById('editServiceId').value = '';
            document.getElementById('isActiveCheck').checked = true;
            document.getElementById('serviceModalTitle').textContent = 'Thêm Dịch Vụ Mới';
            openModal('serviceModal');
        }

        function openEditServiceModal(serviceId) {
            const service = adminServicesList.find(s => s.serviceId === serviceId);
            if (!service) return;

            document.getElementById('editServiceId').value = service.serviceId;
            document.getElementById('serviceName').value = service.serviceName;
            if (service.category) document.getElementById('serviceCategoryId').value = service.category.categoryId;
            document.getElementById('unitPrice').value = service.unitPrice;
            document.getElementById('serviceUnit').value = service.unit || '';
            document.getElementById('isActiveCheck').checked = service.isActive !== false;

            document.getElementById('serviceModalTitle').textContent = `Sửa Dịch Vụ: ${service.serviceName}`;
            openModal('serviceModal');
        }

        async function handleSaveService(event) {
            event.preventDefault();
            const editId = document.getElementById('editServiceId').value;
            const btn = document.getElementById('saveServiceBtn');

            const payload = {
                serviceName: document.getElementById('serviceName').value.trim(),
                categoryId: parseInt(document.getElementById('serviceCategoryId').value) || 1,
                unitPrice: parseFloat(document.getElementById('unitPrice').value),
                unit: document.getElementById('serviceUnit').value.trim(),
                isActive: document.getElementById('isActiveCheck').checked
            };

            btn.disabled = true;
            try {
                let res;
                if (editId) {
                    res = await apiCall(`/api/admin/services/${editId}`, { method: 'PUT', body: payload });
                } else {
                    res = await apiCall('/api/admin/services', { method: 'POST', body: payload });
                }

                btn.disabled = false;
                if (res && res.success) {
                    showToast(editId ? 'Cập nhật dịch vụ thành công!' : 'Tạo dịch vụ mới thành công!', 'success');
                    closeModal('serviceModal');
                    loadServices();
                }
            } catch (err) {
                btn.disabled = false;
            }
        }

        initPage();
    </script>
</body>
</html>
