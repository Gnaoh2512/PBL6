<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - Hotel California</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            max-width: 440px;
            width: 100%;
            padding: 36px 32px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="fs-1 text-primary mb-2"><i class="bi bi-building"></i></div>
            <h2 class="fw-bold fs-4 text-dark mb-1">Hotel California</h2>
            <p class="text-secondary small">Hệ thống quản lý lưu trú & dịch vụ khách sạn</p>
        </div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required autocomplete="username">
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label fw-semibold small mb-0">Mật khẩu</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                Đăng nhập
            </button>
        </form>

        <div class="text-center pt-3 border-top small text-secondary">
            Chưa có tài khoản thành viên? <a href="register.html" class="fw-semibold text-primary text-decoration-none">Đăng ký ngay</a>
            <div class="mt-2"><a href="index.html" class="text-secondary text-decoration-none">← Quay lại trang chủ khách sạn</a></div>
        </div>
    </div>

    <!-- Bootstrap Bundle & App Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function handleLoginSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang xác thực...';

            try {
                const res = await apiCall('/api/auth/login', {
                    method: 'POST',
                    body: { username, password }
                });

                if (res && res.success) {
                    const data = res.data;
                    const token = data.accessToken || data.token;
                    const user = data.user || {
                        username: data.username,
                        fullName: data.fullName,
                        role: data.role
                    };

                    setAuthSession(token, user);
                    showToast('Đăng nhập thành công! Đang chuyển hướng...', 'success');

                    const role = (user.role || '').toUpperCase();
                    setTimeout(() => {
                        if (role.includes('ADMIN') || role.includes('MANAGER')) {
                            window.location.replace('admin-accounts.html');
                        } else if (role.includes('RECEPTIONIST') || role.includes('CASHIER') || role.includes('HOUSEKEEPING')) {
                            window.location.replace('staff-rooms.html');
                        } else {
                            window.location.replace('index.html');
                        }
                    }, 600);
                } else {
                    showToast(res ? res.message : 'Đăng nhập không thành công', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Đăng nhập';
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Đăng nhập';
            }
        }
    </script>
</body>
</html>
