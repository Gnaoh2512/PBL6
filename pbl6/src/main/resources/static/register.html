<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Hotel Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }
        .orb-1 {
            width: 360px;
            height: 360px;
            background: #6366f1;
            top: -60px;
            right: -60px;
        }
        .orb-2 {
            width: 400px;
            height: 400px;
            background: #06b6d4;
            bottom: -80px;
            left: -80px;
        }

        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-header .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #06b6d4, #6366f1);
            margin-bottom: 14px;
            box-shadow: 0 10px 20px -5px rgba(6, 182, 212, 0.4);
        }

        .auth-header .logo svg {
            width: 26px;
            height: 26px;
            fill: #fff;
        }

        .auth-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #f87171;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            color: #fff;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.4;
        }

        .alert-box.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: block;
        }

        .alert-box.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px -5px rgba(6, 182, 212, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -5px rgba(6, 182, 212, 0.6);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }

        .auth-footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .auth-card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <h1>Tạo tài khoản mới</h1>
            <p>Điền thông tin để đăng ký thành viên hệ thống</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="fullName">Họ và tên <span class="required">*</span></label>
                    <input type="text" id="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>

                <div class="form-group full-width">
                    <label for="username">Tên đăng nhập <span class="required">*</span></label>
                    <input type="text" id="username" class="form-control" placeholder="nguyenvana" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu <span class="required">*</span></label>
                    <input type="password" id="password" class="form-control" placeholder="Ít nhất 6 ký tự" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Nhập lại MK <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" class="form-control" placeholder="0901234567" autocomplete="tel">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">Đăng ký tài khoản</span>
            </button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </div>
    </div>

    <script>
        async function handleRegister(event) {
            event.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');

            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();

            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            if (password !== confirmPassword) {
                alertBox.className = 'alert-box error';
                alertBox.textContent = 'Mật khẩu xác nhận không khớp!';
                alertBox.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                alertBox.className = 'alert-box error';
                alertBox.textContent = 'Mật khẩu phải có tối thiểu 6 ký tự!';
                alertBox.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Đang đăng ký...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullName,
                        username,
                        password,
                        email: email || null,
                        phone: phone || null
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alertBox.className = 'alert-box success';
                    alertBox.textContent = 'Đăng ký thành công! Đang chuyển đến trang đăng nhập...';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    let errorMsg = result.message || 'Đăng ký thất bại';
                    if (result.data && typeof result.data === 'object') {
                        errorMsg += ': ' + Object.values(result.data).join(', ');
                    }
                    alertBox.className = 'alert-box error';
                    alertBox.textContent = errorMsg;
                    alertBox.style.display = 'block';
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'Đăng ký tài khoản';
                }
            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.textContent = 'Lỗi kết nối tới máy chủ: ' + err.message;
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Đăng ký tài khoản';
            }
        }
    </script>
</body>
</html>
