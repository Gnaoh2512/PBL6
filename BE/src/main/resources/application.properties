spring.application.name=pbl6

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_management}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Hotel Bank & VietQR Configuration
hotel.bank.bank-id=${BANK_ID:MB}
hotel.bank.account-no=${BANK_ACCOUNT_NO:090123456789}
hotel.bank.account-name=${BANK_ACCOUNT_NAME:AZURE BAY}
hotel.bank.template=compact2
hotel.bank.deposit-percentage=30
hotel.bank.payment-timeout-minutes=15
hotel.bank.sepay-api-key=${SEPAY_API_KEY:}

server.port=${PORT:${SERVER_PORT:9090}}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
assistant.origins=${ASSISTANT_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:9090,http://127.0.0.1:9090}

# D1/D2/D3 Assistant: opt-in server configuration; never forward browser credentials.
assistant.enabled=${AI_ASSISTANT_ENABLED:false}
assistant.business-tools-enabled=${AI_BUSINESS_TOOLS_ENABLED:true}
assistant.booking-tools-enabled=${AI_BOOKING_TOOLS_ENABLED:true}
assistant.corpus-mode=${AI_CORPUS_MODE:production}
assistant.url=${AI_SERVICE_URL:http://127.0.0.1:8006}
assistant.service-token=${AI_SERVICE_AUTH_TOKEN:}

# Keep request bodies and AI responses out of Spring MVC debug logs.
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
