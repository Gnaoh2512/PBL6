spring.application.name=pbl6

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_management}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

# Hotel Bank & VietQR Configuration
hotel.bank.bank-id=${BANK_ID:MB}
hotel.bank.account-no=${BANK_ACCOUNT_NO:090123456789}
hotel.bank.account-name=${BANK_ACCOUNT_NAME:KHACH SAN PBL6}
hotel.bank.template=compact2
hotel.bank.deposit-percentage=30
hotel.bank.payment-timeout-minutes=15
hotel.bank.sepay-api-key=${SEPAY_API_KEY:}

server.port=${SERVER_PORT:9090}